<!doctype html>
<html lang="vi" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!-- Các thẻ title, description, og:*, font và màu theme do scripts/build.mjs ghi vào đây từ wedding.config.js -->
    <!--@HEAD-->

    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" integrity="sha256-zRgmWB5PK4CvTx4FiXsxbHaYRBBjz/rvu97sOC7kzXI=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" integrity="sha256-dABdfBfUoC8vJUBOwGVdm8L9qlMWaHTIfXt+7GnZCIo=" crossorigin="anonymous">
    <link rel="stylesheet" href="./dist/guest.css">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha256-NfRUfZNkERrKSFA0c1a8VmCplPDYtpTYj5lQmKe1R/o=" crossorigin="anonymous"></script>
    <script src="./dist/guest.js"></script>
</head>

<body>
    <!-- Nội dung thiệp: js/app/guest/render.js dựng các phần theo wedding.config.js -->
    <div class="row m-0 p-0 opacity-0" id="root">

        <!-- Màn hình máy tính: cột ảnh bên trái -->
        <div class="sticky-top vh-100 d-none d-sm-block col-sm-5 col-md-6 col-lg-7 col-xl-8 col-xxl-9 overflow-hidden m-0 p-0">
            <div class="position-relative bg-page d-flex justify-content-center align-items-center vh-100" id="desktop-side"></div>
        </div>

        <!-- Màn hình điện thoại: cột thiệp -->
        <div class="col-sm-7 col-md-6 col-lg-5 col-xl-4 col-xxl-3 m-0 p-0 position-relative">
            <main id="main" tabindex="0"></main>
            <nav class="navbar navbar-expand sticky-bottom rounded-top-4 border-top p-0" id="navbar-menu">
                <ul class="navbar-nav nav-justified w-100 align-items-center" id="navbar-list"></ul>
            </nav>
        </div>
    </div>

    <!-- Bìa thư (Mở thiệp) -->
    <div class="loading-page bg-cover-c" id="welcome" style="opacity: 0;"></div>

    <!-- Nút nổi: sáng/tối và nhạc -->
    <div class="d-flex position-fixed flex-column" style="bottom: 12vh; right: 1rem; z-index: 1030;">
        <button type="button" id="button-theme" class="btn btn-float border btn-sm rounded-circle d-none shadow-sm mt-3" aria-label="Đổi giao diện sáng/tối">
            <i class="fa-solid fa-circle-half-stroke"></i>
        </button>
        <button type="button" id="button-music" class="btn btn-float border btn-sm rounded-circle d-none shadow-sm mt-3" aria-label="Bật/tắt nhạc">
            <i class="fa-solid fa-circle-pause spin-button"></i>
        </button>
    </div>

    <!-- Màn hình tải -->
    <div class="loading-page bg-cover-c" id="loading" style="opacity: 1;">
        <div class="d-flex justify-content-center align-items-center vh-100 overflow-y-auto">
            <div class="d-flex flex-column width-loading text-center">
                <div class="loading-mark mb-3 mx-auto" id="loading-mark" aria-hidden="true"></div>
                <div class="progress" role="progressbar" style="height: 0.4rem;" aria-label="Đang tải">
                    <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
                </div>
                <small class="d-none mt-2 cover-small" id="progress-info" style="font-size: 0.8rem;">Đang mở thiệp...</small>
                <noscript>
                    <small class="mt-2 text-danger">Xin lỗi, thiệp cần bật JavaScript để hiển thị.</small>
                </noscript>
            </div>
        </div>
    </div>

    <!-- Xem ảnh lớn -->
    <div class="modal fade" id="modal-image" tabindex="-1" aria-hidden="true" aria-label="Xem ảnh">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content rounded-4 border border-0">
                <div class="modal-body p-0">
                    <div class="d-flex position-absolute top-0 end-0">
                        <a class="btn d-flex justify-content-center align-items-center bg-overlay-auto p-2 m-1 rounded-circle border shadow-sm z-1" role="button" target="_blank" rel="noopener" href="#" id="button-modal-click" aria-label="Mở ảnh trong tab mới">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                        <a class="btn d-flex justify-content-center align-items-center bg-overlay-auto p-2 m-1 rounded-circle border shadow-sm z-1" role="button" href="#" download id="button-modal-download" aria-label="Tải ảnh">
                            <i class="fa-solid fa-download"></i>
                        </a>
                        <button class="btn d-flex justify-content-center align-items-center bg-overlay-auto p-2 m-1 rounded-circle border shadow-sm z-1" data-bs-dismiss="modal" aria-label="Đóng">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </button>
                    </div>
                    <img src="data:," class="img-fluid w-100 rounded-4 cursor-pointer" alt="Ảnh cưới" id="show-modal-image">
                    <button type="button" class="lightbox-nav lightbox-prev d-none" id="lightbox-prev" aria-label="Ảnh trước"><i class="fa-solid fa-chevron-left"></i></button>
                    <button type="button" class="lightbox-nav lightbox-next d-none" id="lightbox-next" aria-label="Ảnh sau"><i class="fa-solid fa-chevron-right"></i></button>
                    <small class="lightbox-count d-none" id="lightbox-count"></small>
                </div>
            </div>
        </div>
    </div>

    <!-- Thông báo nhỏ -->
    <div class="toast-zone position-fixed start-50 translate-middle-x" id="toast-zone" aria-live="polite"></div>
</body>

</html>
